name: Draft source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "${version%%-*}" = "$(cat VERSION)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build pinned Perl and ExifTool helper from verified sources
        run: ./scripts/build-metadata-helper.sh
      - name: Test importer safety
        run: ./test.sh
      - name: Build development-signed app
        run: ./build.sh
      - name: Package and verify archive
        run: |
          ./scripts/package.sh
          ./scripts/verify-package.sh

  draft:
    name: Create reviewable draft source prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          MIT-licensed source preview of Andermic Photo Importer. Build and install locally on macOS using README.md. Apple Developer Program membership is not needed for local builds.

          This release contains source only. Use GitHub’s Source code ZIP or tar archive below, or clone the repository. No prebuilt app binaries are attached.

          Features: a native thumbnail grid, new-photo selection, configurable date folders and presets, RAW/JPEG/sidecar groups, content-confirmed duplicate detection, verified copies, interruption reports and retry, and optional editor handoff/card ejection. The build bundles pinned Perl and ExifTool with their upstream notices.

          Both Apple silicon and Intel builds are tested and package-verified before this draft is created. Real-camera metadata/grouping, real-card performance, physical ejection, editor handoff, clean-machine installs, and earlier macOS versions still need live qualification. Local builds are ad hoc signed and not notarized. This is an early source preview, with no support or compatibility guarantee.

          See README.md for build/install instructions, CHANGELOG.md for changes, and docs/VALIDATION.md for the evidence and remaining limitations. Please report reproducible issues without personal paths or photo metadata.
          NOTES
      - name: Create draft source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            test "$(cat is-draft.txt)" = true
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Andermic Photo Importer $RELEASE_TAG — source preview" --notes-file release-notes.md
          fi
